
<div class="search-bar d-flex align-items-center search-wrapper position-relative"
  [ngClass]="{ 'search-wrapper-active': items.length != 0 }"
>

	<!-- Dropdown de Categorías -->
	<div class="category-dropdown-wrapper">
		<button
			type="button"
			class="category-trigger"
			(click)="toggleDropdown()"
			[class.active]="dropdownOpen"
		>
			<span class="category-trigger-text">{{ displayLabel }}</span>
			<mat-icon class="category-trigger-arrow" [class.rotated]="dropdownOpen">keyboard_arrow_down</mat-icon>
		</button>

		<div class="category-panel" *ngIf="dropdownOpen">
			<button
				type="button"
				class="category-item"
				*ngFor="let cat of categories"
				[class.selected]="selectedCategory === cat.id"
				(click)="selectCategory(cat)"
			>
				<mat-icon class="category-check">
					{{ selectedCategory === cat.id ? 'check_circle' : 'radio_button_unchecked' }}
				</mat-icon>
				<span class="category-name">{{ cat.name }}</span>
			</button>

			<button
				type="button"
				class="category-item category-item-all"
				(click)="selectAll()"
			>
				<span class="category-name">Todos los estudios</span>
			</button>
		</div>
	</div>

	<input type="text" class="form-control border-0 input-custom"
		placeholder="Encuentra el estudio que deseas realizar..." (input)="onSearch($any($event.target).value)"
		autocomplete="off" />

	<button class="btn search-btn d-flex align-items-center justify-content-center" type="button">
		<mat-icon>search</mat-icon>
	</button>

	<div class="autocomplete-panel" *ngIf="showAutocomplete && items.length > 0">
		<div class="autocomplete-inner">
			<button type="button" class="autocomplete-item" *ngFor="let item of items; let last = last"
				[class.no-border]="last" (click)="selectItem(item)">
				{{ item.producto }}
			</button>
		</div>
	</div>
</div>
