<div class="container-fluid">
    <div class="row mt-3 mb-5">
        <div class="columna-izquierda">
            <img src="img/banners/baner-vertical.jpg" alt="" class="w-100">
        </div>

        <div class="columna-central">
            <div id="bannerCarousel" class="carousel slide" data-bs-ride="carousel">


                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1">
                    </button>

                    <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="1" aria-label="Slide 2">
                    </button>
                </div>


                <div class="carousel-inner">

                    <div class="carousel-item active">
                        <img src="img/banners/banner-1.ajpg.jpg" class="d-block w-100" alt="Banner 1">
                    </div>

                    <div class="carousel-item">
                        <img src="img/banners/banner-2.jpg" class="d-block w-100" alt="Banner 1">
                    </div>

                    <div class="carousel-item">
                        <img src="img/banners/banner-3.jpg" class="d-block w-100" alt="Banner 1">
                    </div>

                    <!-- <div class="carousel-item">
                    <img src="img/banners/2.jpg" class="d-block w-100" alt="Banner 2">
                </div> -->

                </div>


                <button class="carousel-control-prev" type="button" data-bs-target="#bannerCarousel"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#bannerCarousel"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>

            </div>
        </div>

        <div class="columna-derecha">
            <div class="mb-3">
                <img src="img/banners/banner-horizontal1.jpg" alt="" class="w-100">
            </div>

            <div>
                <img src="img/banners/banner-horizontal2.jpg" alt="" class="w-100">
            </div>
        </div>
    </div>
</div>

<div class="container">

    <div class="container my-4">
        <div class="row g-4">
            <div class="col-12 p-3">
                <h5 class="mb-3">Estudios</h5>
            </div>
        </div>

        <div class="row g-4">
            @for (fam of familias(); track fam.idFamiliaWeb) {
            <div class="col-4 col-md-3 col-lg-2 text-center" (click)="onFamiliaClick(fam)" style="cursor: pointer;">
                <div class="d-flex justify-content-center mb-2">
                    <img [src]="'img/iconos/' + iconName(fam.familiaWeb) + '.svg'" [alt]="fam.familiaWeb"
                        style="width: 64px; height: 64px; object-fit: contain;" />
                </div>

                <div style="font-size: 12px;">
                    {{ fam.familiaWeb }}
                </div>
            </div>
            }
        </div>
    </div>





    <div class="container-fluid p-3 pb-5 rounded-3" style="background-color: #f3fbff;">
        <div class="container">
            <div class="row g-3 align-items-center">
                <div class="col-12">
                    <h5 class="mb-0">Los más buscados</h5>
                </div>
            </div>

            <div class="row g-3 mt-1">
                @for (p of topProducts(); track p.idProducto) {
                <div class="col-6 col-md-4 col-lg-2">

                    <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">

                        <div class="d-flex justify-content-between align-items-start p-2">

                            <div class="rounded-circle d-flex align-items-center justify-content-center"
                                style="width: 52px; height: 52px; background: #e9f3ff;">
                                <img [src]="'img/iconos/' + iconName(p.familiaWeb) + '.svg'" [alt]="p.familiaWeb"
                                    style="width: 32px; height: 32px; object-fit: contain;" />
                            </div>


                            <div class="d-flex gap-1">
                                <mat-icon
                                    style="font-size: 20px; width: 20px; height: 20px; color: #e11d48;">sell</mat-icon>
                                <mat-icon
                                    style="font-size: 20px; width: 20px; height: 20px; color: #e11d48;">favorite</mat-icon>
                            </div>
                        </div>


                        <div class="px-3">
                            <div class="fw-semibold p-1 text-center" style="font-size: 13px; line-height: 1.2;">
                                {{ p.producto }}
                            </div>

                            <div class="text-muted mt-1 text-center" style="font-size: 11px; line-height: 1.2;">
                                de {{ p.idProducto }} elementos
                            </div>




                            @if (p.precio) {
                            <div class="mt-2" style="font-size: 12px;">
                                A solo
                            </div>
                            <div class="fw-bold" style="font-size: 18px;">
                                ${{ p.precio }}
                            </div>
                            }
                        </div>


                        <div class="d-flex button-container">
                            <button type="button"
                                class="btn w-100 rounded-0 text-white py-2 d-flex justify-content-center align-items-center"
                                style="background-color: #1f5fbf;">
                                <span style="font-size: 12px;">Agregar</span>
                                <mat-icon class="ms-2"
                                    style="font-size: 18px; width: 18px; height: 18px;">shopping_cart</mat-icon>
                            </button>
                        </div>

                    </div>
                </div>
                }
            </div>
        </div>
    </div>
</div>
